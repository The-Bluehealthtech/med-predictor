name: 🚀 CI/CD Pipeline avec Notifications Email

on:
  push:
    branches: [ develop-v3, main ]
  pull_request:
    branches: [ develop-v3, main ]
  workflow_dispatch:

env:
  NOTIFICATION_EMAIL: "im0668@gmail.com"
  NOTIFICATION_SCRIPT: "scripts/github-notifications.sh"
  PHP_VERSION: "8.2"
  COMPOSER_CACHE_DIR: ".composer-cache"

jobs:
  # Validation et Tests
  validate-and-test:
    runs-on: ubuntu-latest
    name: "🔍 Validation & Tests"
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🐘 Configuration PHP ${{ env.PHP_VERSION }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          coverage: xdebug
          
      - name: "📦 Installation Composer"
        uses: "ramsey/composer-install@v2"
        with:
          composer-options: "--prefer-dist --optimize-autoloader"
          dependency-versions: "locked"
          
      - name: "🔧 Configuration Laravel"
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:cache
          
      - name: "🧪 Exécution des Tests PHP"
        run: |
          echo "🧪 Exécution des tests PHP..."
          php artisan test --coverage-html=coverage/
          echo "✅ Tests terminés"
          
      - name: "📊 Upload Coverage"
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/cobertura-coverage.xml
          flags: unittests
          name: codecov-umbrella
          
      - name: "🔍 Audit du Projet"
        run: |
          echo "🔍 Audit du projet..."
          php artisan project:audit --format=json --output=audit-report.json
          php artisan project:db:audit --output=db-audit-report.json
          echo "✅ Audit terminé"
          
      - name: "📦 Upload Rapports d'Audit"
        uses: actions/upload-artifact@v3
        with:
          name: audit-reports
          path: |
            audit-report.json
            db-audit-report.json
          retention-days: 30

  # Build et Optimisation
  build:
    runs-on: ubuntu-latest
    name: "🏗️ Build & Optimisation"
    needs: validate-and-test
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🐘 Configuration PHP ${{ env.PHP_VERSION }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          
      - name: "📦 Installation Composer (Production)"
        uses: "ramsey/composer-install@v2"
        with:
          composer-options: "--no-dev --prefer-dist --optimize-autoloader"
          dependency-versions: "locked"
          
      - name: "🏗️ Build de l'Application"
        run: |
          echo "🏗️ Build de l'application..."
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          echo "✅ Build terminé"
          
      - name: "📦 Upload Build Artifacts"
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            vendor/
            bootstrap/cache/
          retention-days: 1

  # Notifications de Succès
  notify-success:
    runs-on: ubuntu-latest
    name: "📧 Notification de Succès"
    needs: [validate-and-test, build]
    if: success()
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🐘 Configuration PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          
      - name: "📦 Installation Composer"
        uses: "ramsey/composer-install@v2"
        with:
          composer-options: "--prefer-dist"
          
      - name: "📧 Envoi Notification de Succès"
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "📧 Envoi de notification de succès..."
          export CI_PIPELINE_STATUS="success"
          bash ${{ env.NOTIFICATION_SCRIPT }}
          echo "✅ Notification de succès envoyée"

  # Notifications d'Échec
  notify-failure:
    runs-on: ubuntu-latest
    name: "📧 Notification d'Échec"
    needs: [validate-and-test, build]
    if: failure()
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🐘 Configuration PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          
      - name: "📦 Installation Composer"
        uses: "ramsey/composer-install@v2"
        with:
          composer-options: "--prefer-dist"
          
      - name: "📧 Envoi Notification d'Échec"
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "📧 Envoi de notification d'échec..."
          export CI_PIPELINE_STATUS="failed"
          bash ${{ env.NOTIFICATION_SCRIPT }}
          echo "✅ Notification d'échec envoyée"

  # Déploiement Staging (Manuel)
  deploy-staging:
    runs-on: ubuntu-latest
    name: "🚀 Déploiement Staging"
    needs: [validate-and-test, build]
    if: github.ref == 'refs/heads/develop-v3'
    environment: staging
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🚀 Déploiement en Staging"
        run: |
          echo "🚀 Déploiement en staging..."
          echo "✅ Déploiement staging terminé (simulé)"
          # Ici vous ajouteriez vos commandes de déploiement réelles
          # ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "cd ${{ secrets.STAGING_PATH }} && git pull origin develop-v3"

  # Déploiement Production (Manuel)
  deploy-production:
    runs-on: ubuntu-latest
    name: "🚀 Déploiement Production"
    needs: [validate-and-test, build]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🚀 Déploiement en Production"
        run: |
          echo "🚀 Déploiement en production..."
          echo "✅ Déploiement production terminé (simulé)"
          # Ici vous ajouteriez vos commandes de déploiement réelles
          # ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} "cd ${{ secrets.PRODUCTION_PATH }} && git pull origin main"
