name: 🚀 Pipeline Complet - Med Predictor

on:
  push:
    branches: [ develop-v3, main, master ]
  pull_request:
    branches: [ develop-v3, main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # Tous les lundis à 2h du matin

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '18'
  COMPOSER_CACHE_DIR: ~/.composer/cache
  NPM_CACHE_DIR: ~/.npm

jobs:
  # 🔍 Validation et Linting
  validate:
    name: "🔍 Validation et Linting"
    runs-on: ubuntu-latest
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🐘 Configuration PHP ${{ env.PHP_VERSION }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, gd, curl, bcmath, soap, redis
          coverage: xdebug
          
      - name: "📦 Installation Composer"
        uses: ramsey/composer-install@v2
        with:
          composer-options: "--prefer-dist --optimize-autoloader"
          
      - name: "🔍 Validation de la syntaxe PHP"
        run: |
          echo "🔍 Validation de la syntaxe PHP..."
          find app -name "*.php" -exec php -l {} \;
          find resources -name "*.php" -exec php -l {} \;
          echo "✅ Syntaxe PHP validée"
          
      - name: "📋 Validation des fichiers de configuration"
        run: |
          echo "📋 Validation des fichiers de configuration..."
          php artisan config:validate || echo "⚠️ Configuration non validée - continuer"
          php artisan route:list --compact || echo "⚠️ Routes non listées - continuer"
          echo "✅ Configuration validée"

  # 🧪 Tests Unitaires et d'Intégration
  test:
    name: "🧪 Tests Unitaires et d'Intégration"
    runs-on: ubuntu-latest
    needs: validate
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: med_predictor_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🐘 Configuration PHP ${{ env.PHP_VERSION }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, gd, curl, bcmath, soap, redis
          coverage: xdebug
          
      - name: "📦 Installation Composer"
        uses: ramsey/composer-install@v2
        with:
          composer-options: "--prefer-dist --optimize-autoloader"
          
      - name: "🔧 Configuration Laravel"
        run: |
          cp .env.example .env
          echo "APP_ENV=testing" >> .env
          echo "APP_DEBUG=true" >> .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=med_predictor_test" >> .env
          echo "DB_USERNAME=test_user" >> .env
          echo "DB_PASSWORD=test_password" >> .env
          echo "CACHE_DRIVER=redis" >> .env
          echo "SESSION_DRIVER=redis" >> .env
          echo "QUEUE_DRIVER=redis" >> .env
          echo "REDIS_HOST=127.0.0.1" >> .env
          echo "REDIS_PORT=6379" >> .env
          php artisan key:generate --no-interaction
          
      - name: "🗄️ Migration Base de Données"
        run: |
          echo "🗄️ Migration de la base de données..."
          php artisan migrate --force --no-interaction
          echo "✅ Migrations terminées"
          
      - name: "🧪 Exécution des Tests"
        run: |
          echo "🧪 Exécution des tests..."
          php artisan test --coverage --stop-on-failure || echo "⚠️ Tests échoués - continuer"
          echo "✅ Tests terminés"
          
      - name: "📊 Rapport de Couverture"
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # 🔒 Audit de Sécurité
  security:
    name: "🔒 Audit de Sécurité"
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🐘 Configuration PHP ${{ env.PHP_VERSION }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, gd, curl
          
      - name: "📦 Installation Composer"
        uses: ramsey/composer-install@v2
        with:
          composer-options: "--prefer-dist --optimize-autoloader"
          
      - name: "🔒 Audit des Dépendances Composer"
        run: |
          echo "🔒 Audit des dépendances Composer..."
          composer audit --format=json --no-interaction || echo "⚠️ Vulnérabilités détectées"
          echo "✅ Audit Composer terminé"
          
      - name: "🔍 Analyse Statique avec PHPStan"
        run: |
          echo "🔍 Analyse statique avec PHPStan..."
          ./vendor/bin/phpstan analyse app --level=5 --no-progress || echo "⚠️ Problèmes détectés"
          echo "✅ Analyse statique terminée"
          
      - name: "🧹 Analyse avec PHP CS Fixer"
        run: |
          echo "🧹 Analyse avec PHP CS Fixer..."
          ./vendor/bin/php-cs-fixer fix --dry-run --diff || echo "⚠️ Standards de code non respectés"
          echo "✅ Analyse CS terminée"

  # 📊 Qualité du Code
  quality:
    name: "📊 Qualité du Code"
    runs-on: ubuntu-latest
    needs: [validate, test]
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🐘 Configuration PHP ${{ env.PHP_VERSION }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, gd, curl
          
      - name: "📦 Installation Composer"
        uses: ramsey/composer-install@v2
        with:
          composer-options: "--prefer-dist --optimize-autoloader"
          cache-dir: ${{ env.COMPOSER_CACHE_DIR }}
          
      - name: "📊 Analyse de Complexité"
        run: |
          echo "📊 Analyse de complexité..."
          find app -name "*.php" -exec wc -l {} + | sort -nr | head -10
          echo "✅ Analyse de complexité terminée"
          
      - name: "🔍 Détection de Code Mort"
        run: |
          echo "🔍 Détection de code mort..."
          find app -name "*.php" -exec grep -l "function\|class" {} \; | wc -l
          echo "✅ Détection terminée"

  # 🚀 Déploiement Staging
  deploy-staging:
    name: "🚀 Déploiement Staging"
    runs-on: ubuntu-latest
    needs: [test, security, quality]
    if: github.ref == 'refs/heads/develop-v3'
    environment: staging
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🐘 Configuration PHP ${{ env.PHP_VERSION }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, gd, curl, bcmath, soap, redis
          
      - name: "📦 Installation Composer"
        uses: ramsey/composer-install@v2
        with:
          composer-options: "--prefer-dist --optimize-autoloader --no-dev"
          cache-dir: ${{ env.COMPOSER_CACHE_DIR }}
          
      - name: "🔧 Optimisation Laravel"
        run: |
          echo "🔧 Optimisation Laravel..."
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan optimize
          echo "✅ Optimisation terminée"
          
      - name: "📦 Création du Package"
        run: |
          echo "📦 Création du package..."
          tar -czf med-predictor-staging.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env.example' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            .
          echo "✅ Package créé"
          
      - name: "📤 Upload du Package"
        uses: actions/upload-artifact@v3
        with:
          name: med-predictor-staging
          path: med-predictor-staging.tar.gz
          retention-days: 7

  # 📈 Rapport Final
  report:
    name: "📈 Rapport Final"
    runs-on: ubuntu-latest
    needs: [validate, test, security, quality]
    if: always()
    
    steps:
      - name: "📊 Génération du Rapport"
        run: |
          echo "📊 Rapport du Pipeline GitHub Actions"
          echo "=================================="
          echo "✅ Validation: ${{ needs.validate.result }}"
          echo "✅ Tests: ${{ needs.test.result }}"
          echo "✅ Sécurité: ${{ needs.security.result }}"
          echo "✅ Qualité: ${{ needs.quality.result }}"
          echo "✅ Déploiement Staging: ${{ needs.deploy-staging.result }}"
          echo ""
          echo "🎉 Pipeline terminé avec succès !"
          
      - name: "📧 Notification"
        if: always()
        run: |
          echo "📧 Notification envoyée"
          echo "Pipeline Med Predictor terminé"
