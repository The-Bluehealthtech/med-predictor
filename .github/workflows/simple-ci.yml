name: 🚀 CI Simple avec Notifications Email

on:
  push:
    branches: [ develop-v3, main ]
  pull_request:
    branches: [ develop-v3, main ]
  workflow_dispatch:

env:
  NOTIFICATION_EMAIL: "im0668@gmail.com"

jobs:
  # Tests et Validation
  test:
    runs-on: ubuntu-latest
    name: "🧪 Tests et Validation"
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🐘 Configuration PHP 8.2"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          coverage: xdebug
          
      - name: "📦 Installation Composer (sans scripts ni autoloader)"
        run: |
          # Sauvegarder composer.json original
          cp composer.json composer.json.backup
          # Supprimer temporairement les scripts
          sed -i '/"scripts":/,/}/d' composer.json
          # Installer sans scripts
          composer install --prefer-dist --no-scripts --no-autoloader --no-dev
          echo "✅ Composer install terminé sans scripts ni autoloader"
          
      - name: "🔧 Préparation de l'environnement"
        run: |
          cp .env.example .env
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=database/database.sqlite" >> .env
          mkdir -p database
          touch database/database.sqlite
          chmod 777 database/database.sqlite
          
      - name: "🔧 Configuration Laravel"
        run: |
          composer install --no-scripts --no-autoloader --dev
          composer dump-autoload --optimize
          php artisan key:generate
          php artisan package:discover --ansi
          php artisan config:cache
          # Restaurer composer.json original
          mv composer.json.backup composer.json
          
      - name: "🧪 Exécution des Tests"
        run: |
          echo "🧪 Exécution des tests PHP..."
          php artisan test --stop-on-failure
          echo "✅ Tests terminés"
          
      - name: "🔍 Audit du Projet"
        run: |
          echo "🔍 Audit du projet..."
          php artisan project:audit --format=json --output=audit-report.json || echo "Audit optionnel - fichier non créé"
          php artisan project:db:audit --output=db-audit-report.json || echo "Audit DB optionnel - fichier non créé"
          echo "✅ Audit terminé"
          
      - name: "📋 Vérification des Fichiers"
        run: |
          echo "📋 Vérification des fichiers générés..."
          ls -la *.json 2>/dev/null || echo "Aucun fichier JSON trouvé"
          echo "📁 Contenu du répertoire :"
          ls -la
          
      - name: "📦 Upload Rapports"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            audit-report.json
            db-audit-report.json
            composer.lock
            composer.json
          retention-days: 30
          
      - name: "🐛 Debug - Informations Système"
        if: always()
        run: |
          echo "🐛 Debug - Informations système :"
          echo "PHP Version: $(php -v | head -1)"
          echo "Composer Version: $(composer --version)"
          echo "Laravel Version: $(php artisan --version)"
          echo "Répertoire de travail: $(pwd)"
          echo "Contenu: $(ls -la)"

  # Notifications de Succès
  notify-success:
    runs-on: ubuntu-latest
    name: "📧 Notification de Succès"
    needs: test
    if: success()
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🐘 Configuration PHP 8.2"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          
      - name: "📦 Installation Composer"
        uses: "ramsey/composer-install@v2"
        with:
          composer-options: "--prefer-dist"
          
      - name: "📧 Envoi Notification de Succès"
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "📧 Envoi de notification de succès..."
          echo "🔍 Debug des variables d'environnement:"
          echo "  SMTP_HOST: ${SMTP_HOST:-'NON DÉFINI'}"
          echo "  SMTP_PORT: ${SMTP_PORT:-'NON DÉFINI'}"
          echo "  SMTP_USERNAME: ${SMTP_USERNAME:-'NON DÉFINI'}"
          echo "  SMTP_PASSWORD: ${SMTP_PASSWORD:0:3}*** (longueur: ${#SMTP_PASSWORD})"
          export CI_PIPELINE_STATUS="success"
          bash scripts/github-notifications.sh
          echo "✅ Notification de succès envoyée"

  # Notifications d'Échec
  notify-failure:
    runs-on: ubuntu-latest
    name: "📧 Notification d'Échec"
    needs: test
    if: failure()
    
    steps:
      - name: "📥 Checkout du code"
        uses: actions/checkout@v4
        
      - name: "🐘 Configuration PHP 8.2"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip
          
      - name: "📦 Installation Composer"
        uses: "ramsey/composer-install@v2"
        with:
          composer-options: "--prefer-dist"
          
      - name: "📧 Envoi Notification d'Échec"
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "📧 Envoi de notification d'échec..."
          echo "🔍 Debug des variables d'environnement:"
          echo "  SMTP_HOST: ${SMTP_HOST:-'NON DÉFINI'}"
          echo "  SMTP_PORT: ${SMTP_PORT:-'NON DÉFINI'}"
          echo "  SMTP_USERNAME: ${SMTP_USERNAME:-'NON DÉFINI'}"
          echo "  SMTP_PASSWORD: ${SMTP_PASSWORD:0:3}*** (longueur: ${#SMTP_PASSWORD})"
          export CI_PIPELINE_STATUS="failed"
          bash scripts/github-notifications.sh
          echo "✅ Notification d'échec envoyée"
