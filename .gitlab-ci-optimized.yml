# GitLab CI/CD Pipeline Optimisé pour l'Audit de Base de Données
# Version: 2.0 - Optimisée pour GitLab

stages:
  - validate
  - setup
  - audit
  - report
  - quality-gate
  - deploy

variables:
  PHP_VERSION: "8.2"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  AUDIT_REPORT_DIR: "$CI_PROJECT_DIR/audit-reports"
  
  # Seuils de qualité configurables
  CLEANLINESS_THRESHOLD: "${CLEANLINESS_THRESHOLD:-70}"
  ORPHAN_TABLES_THRESHOLD: "${ORPHAN_TABLES_THRESHOLD:-30}"
  UNUSED_MODELS_THRESHOLD: "${UNUSED_MODELS_THRESHOLD:-15}"

# Cache optimisé pour GitLab
cache:
  key: 
    files:
      - composer.lock
      - package-lock.json
  paths:
    - .composer-cache/
    - vendor/
    - node_modules/
  policy: pull-push

# Règles globales du pipeline
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^feature\/.*/
    - if: $CI_COMMIT_BRANCH =~ /^hotfix\/.*/
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Job de validation préliminaire
validate-pipeline:
  stage: validate
  image: alpine:latest
  script:
    - echo "🔍 Validation du pipeline GitLab CI/CD"
    - echo "📋 Variables d'environnement:"
    - echo "  - PHP_VERSION: $PHP_VERSION"
    - echo "  - CLEANLINESS_THRESHOLD: $CLEANLINESS_THRESHOLD"
    - echo "  - ORPHAN_TABLES_THRESHOLD: $ORPHAN_TABLES_THRESHOLD"
    - echo "  - UNUSED_MODELS_THRESHOLD: $UNUSED_MODELS_THRESHOLD"
    - echo "✅ Validation terminée"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Job de configuration optimisé
setup-environment:
  stage: setup
  image: php:${PHP_VERSION}-fpm
  before_script:
    - echo "🚀 Configuration de l'environnement GitLab CI/CD"
    - apt-get update -qq && apt-get install -y -qq git unzip sqlite3 libsqlite3-dev curl
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer config cache-dir $COMPOSER_CACHE_DIR
    - composer config --global github-protocols https
  script:
    - echo "📦 Installation des dépendances..."
    - composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader
    - echo "⚙️  Configuration de l'environnement..."
    - cp .env.example .env
    - php artisan key:generate --no-interaction
    - echo "🗄️  Configuration de la base de données..."
    - touch database/database.sqlite
    - echo "DB_CONNECTION=sqlite" >> .env
    - echo "DB_DATABASE=database/database.sqlite" >> .env
    - echo "DB_HOST=127.0.0.1" >> .env
    - echo "DB_PORT=3306" >> .env
    - echo "CACHE_DRIVER=array" >> .env
    - echo "SESSION_DRIVER=array" >> .env
    - echo "QUEUE_DRIVER=sync" >> .env
    - echo "🔄 Exécution des migrations..."
    - php artisan migrate --force --no-interaction
    - echo "🧹 Nettoyage du cache..."
    - php artisan config:clear
    - php artisan cache:clear
    - php artisan view:clear
    - echo "✅ Configuration terminée"
  artifacts:
    paths:
      - vendor/
      - .env
      - database/database.sqlite
      - bootstrap/cache/
    expire_in: 2 hours
    reports:
      junit: setup-results.xml
  coverage: '/Code Coverage: \d+\.\d+%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Job d'audit principal optimisé
run-database-audit:
  stage: audit
  image: php:${PHP_VERSION}-fpm
  dependencies:
    - setup-environment
  before_script:
    - echo "🔍 Démarrage de l'audit de base de données"
    - apt-get update -qq && apt-get install -y -qq sqlite3 jq
    - composer config cache-dir $COMPOSER_CACHE_DIR
    - mkdir -p $AUDIT_REPORT_DIR
  script:
    - echo "📦 Installation des dépendances..."
    - composer install --prefer-dist --no-progress --no-interaction
    - echo "🔍 Exécution de l'audit..."
    - timeout $AUDIT_TIMEOUT php artisan project:db:audit
    - echo "📊 Analyse des résultats..."
    - |
      # Trouver le rapport le plus récent
      LATEST_REPORT=$(ls -t storage/logs/db-audit-*.log | head -1)
      
      if [ -z "$LATEST_REPORT" ]; then
        echo "❌ Aucun rapport d'audit trouvé"
        exit 1
      fi
      
      echo "📋 Rapport trouvé: $LATEST_REPORT"
      
      # Extraire les métriques clés avec gestion d'erreur
      CLEANLINESS_SCORE=$(grep -o '"cleanliness_score": "[^"]*"' "$LATEST_REPORT" | cut -d'"' -f4 | sed 's/%//' || echo "0")
      TOTAL_TABLES=$(grep -o '"total_tables": [0-9]*' "$LATEST_REPORT" | cut -d':' -f2 | tr -d ' ' || echo "0")
      ORPHAN_TABLES=$(grep -o '"orphan_tables": \[[^]]*\]' "$LATEST_REPORT" | grep -o '"[^"]*"' | wc -l || echo "0")
      UNUSED_MODELS=$(grep -o '"unused_models": \[[^]]*\]' "$LATEST_REPORT" | grep -o '"[^"]*"' | wc -l || echo "0")
      
      # Calculer le pourcentage de tables orphelines
      if [ "$TOTAL_TABLES" -gt 0 ]; then
        ORPHAN_TABLES_PERCENT=$((ORPHAN_TABLES * 100 / TOTAL_TABLES))
      else
        ORPHAN_TABLES_PERCENT=0
      fi
      
      # Sauvegarder les résultats pour les jobs suivants
      cat > build.env << EOF
      CLEANLINESS_SCORE=$CLEANLINESS_SCORE
      TOTAL_TABLES=$TOTAL_TABLES
      ORPHAN_TABLES=$ORPHAN_TABLES
      UNUSED_MODELS=$UNUSED_MODELS
      ORPHAN_TABLES_PERCENT=$ORPHAN_TABLES_PERCENT
      AUDIT_TIMESTAMP=$(date +%s)
      EOF
      
      # Afficher un résumé détaillé
      echo "🔍 Résultats de l'audit GitLab CI/CD:"
      echo "📊 Score de propreté: ${CLEANLINESS_SCORE}%"
      echo "🗃️ Tables totales: ${TOTAL_TABLES}"
      echo "❌ Tables orphelines: ${ORPHAN_TABLES}"
      echo "🏗️ Modèles non utilisés: ${UNUSED_MODELS}"
      echo "📈 Pourcentage tables orphelines: ${ORPHAN_TABLES_PERCENT}%"
      echo "⏰ Timestamp: $(date)"
      
      # Copier le rapport dans le répertoire de travail
      cp "$LATEST_REPORT" "$AUDIT_REPORT_DIR/latest-audit.json"
      echo "📋 Rapport copié dans $AUDIT_REPORT_DIR/"
  artifacts:
    paths:
      - storage/logs/db-audit-*.log
      - build.env
      - audit-reports/
    reports:
      junit: audit-results.xml
    expire_in: 1 week
  coverage: '/Code Coverage: \d+\.\d+%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Job de génération de rapport HTML optimisé
generate-html-report:
  stage: report
  image: alpine:latest
  dependencies:
    - run-database-audit
  before_script:
    - apk add --no-cache jq
    - mkdir -p $AUDIT_REPORT_DIR
  script:
    - echo "📄 Génération du rapport HTML..."
    - |
      # Charger les variables d'environnement
      source build.env
      
      # Créer un rapport HTML moderne et responsive
      cat > "$AUDIT_REPORT_DIR/audit-report.html" << 'EOF'
      <!DOCTYPE html>
      <html lang="fr">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Rapport d'Audit Base de Données - GitLab CI/CD</title>
          <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { 
                  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
                  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                  min-height: 100vh;
                  padding: 20px;
              }
              .container { 
                  max-width: 1200px; 
                  margin: 0 auto; 
                  background: white; 
                  border-radius: 20px; 
                  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
                  overflow: hidden;
              }
              .header { 
                  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
                  color: white; 
                  padding: 40px; 
                  text-align: center; 
              }
              .header h1 { font-size: 2.5em; margin-bottom: 10px; }
              .header p { font-size: 1.2em; opacity: 0.9; }
              .gitlab-info { 
                  background: rgba(255,255,255,0.1); 
                  padding: 20px; 
                  border-radius: 15px; 
                  margin-top: 20px;
                  backdrop-filter: blur(10px);
              }
              .score-display { 
                  text-align: center; 
                  padding: 40px; 
                  background: #f8f9fa;
              }
              .score { 
                  font-size: 4em; 
                  font-weight: bold; 
                  margin: 20px 0;
                  text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
              }
              .score.excellent { color: #28a745; }
              .score.good { color: #17a2b8; }
              .score.warning { color: #ffc107; }
              .score.danger { color: #dc3545; }
              .metrics-grid { 
                  display: grid; 
                  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
                  gap: 25px; 
                  padding: 40px; 
              }
              .metric-card { 
                  background: white; 
                  padding: 30px; 
                  border-radius: 15px; 
                  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
                  text-align: center;
                  border-top: 5px solid #667eea;
                  transition: transform 0.3s ease;
              }
              .metric-card:hover { transform: translateY(-5px); }
              .metric-value { 
                  font-size: 2.5em; 
                  font-weight: bold; 
                  margin: 15px 0;
                  color: #667eea;
              }
              .recommendations { 
                  background: #e7f3ff; 
                  padding: 30px; 
                  margin: 40px; 
                  border-radius: 15px; 
                  border-left: 5px solid #17a2b8;
              }
              .recommendations h3 { color: #17a2b8; margin-bottom: 20px; }
              .recommendations ul { padding-left: 20px; }
              .recommendations li { margin: 10px 0; line-height: 1.6; }
              .progress-bar { 
                  width: 100%; 
                  height: 20px; 
                  background: #e9ecef; 
                  border-radius: 10px; 
                  overflow: hidden; 
                  margin: 20px 0;
              }
              .progress-fill { 
                  height: 100%; 
                  background: linear-gradient(90deg, #28a745, #20c997); 
                  transition: width 0.5s ease;
                  border-radius: 10px;
              }
              .progress-fill.warning { background: linear-gradient(90deg, #ffc107, #fd7e14); }
              .progress-fill.danger { background: linear-gradient(90deg, #dc3545, #e83e8c); }
              .footer { 
                  background: #f8f9fa; 
                  padding: 30px; 
                  text-align: center; 
                  color: #6c757d;
              }
              @media (max-width: 768px) {
                  .header h1 { font-size: 2em; }
                  .metrics-grid { grid-template-columns: 1fr; }
                  .container { margin: 10px; }
              }
          </style>
      </head>
      <body>
          <div class="container">
              <div class="header">
                  <h1>🔍 Rapport d'Audit Base de Données</h1>
                  <p>Généré par GitLab CI/CD Pipeline</p>
                  <div class="gitlab-info">
                      <p><strong>Projet:</strong> $CI_PROJECT_NAME</p>
                      <p><strong>Pipeline:</strong> #$CI_PIPELINE_ID</p>
                      <p><strong>Branche:</strong> $CI_COMMIT_REF_NAME</p>
                      <p><strong>Commit:</strong> $CI_COMMIT_SHORT_SHA</p>
                      <p><strong>Date:</strong> $(date)</p>
                  </div>
              </div>
              
              <div class="score-display">
                  <h2>📊 Score de Propreté</h2>
                  <div class="score $([ $CLEANLINESS_SCORE -ge 90 ] && echo 'excellent' || ([ $CLEANLINESS_SCORE -ge 80 ] && echo 'good') || ([ $CLEANLINESS_SCORE -ge 70 ] && echo 'warning') || echo 'danger')">
                      ${CLEANLINESS_SCORE}%
                  </div>
                  <div class="progress-bar">
                      <div class="progress-fill $([ $CLEANLINESS_SCORE -ge 80 ] && echo '' || ([ $CLEANLINESS_SCORE -ge 70 ] && echo 'warning') || echo 'danger')" style="width: ${CLEANLINESS_SCORE}%"></div>
                  </div>
                  <p>Seuil critique: $CLEANLINESS_THRESHOLD% | Seuil d'avertissement: 80%</p>
              </div>
              
              <div class="metrics-grid">
                  <div class="metric-card">
                      <h3>🗃️ Tables Totales</h3>
                      <div class="metric-value">${TOTAL_TABLES}</div>
                      <p>Tables dans la base de données</p>
                  </div>
                  
                  <div class="metric-card">
                      <h3>❌ Tables Orphelines</h3>
                      <div class="metric-value $([ $ORPHAN_TABLES -eq 0 ] && echo 'excellent' || ([ $ORPHAN_TABLES -le 5 ] && echo 'good') || ([ $ORPHAN_TABLES -le 10 ] && echo 'warning') || echo 'danger')">${ORPHAN_TABLES}</div>
                      <p>Sans modèle Eloquent</p>
                  </div>
                  
                  <div class="metric-card">
                      <h3>🏗️ Modèles Non Utilisés</h3>
                      <div class="metric-value $([ $UNUSED_MODELS -eq 0 ] && echo 'excellent' || ([ $UNUSED_MODELS -le 3 ] && echo 'good') || ([ $UNUSED_MODELS -le 8 ] && echo 'warning') || echo 'danger')">${UNUSED_MODELS}</div>
                      <p>Jamais référencés</p>
                  </div>
                  
                  <div class="metric-card">
                      <h3>📈 Pourcentage Orphelines</h3>
                      <div class="metric-value $([ $ORPHAN_TABLES_PERCENT -le 10 ] && echo 'excellent' || ([ $ORPHAN_TABLES_PERCENT -le 20 ] && echo 'good') || ([ $ORPHAN_TABLES_PERCENT -le 30 ] && echo 'warning') || echo 'danger')">${ORPHAN_TABLES_PERCENT}%</div>
                      <p>Tables sans modèle</p>
                  </div>
              </div>
              
              <div class="recommendations">
                  <h3>💡 Recommandations GitLab CI/CD</h3>
                  <ul>
      EOF
      
      # Ajouter des recommandations dynamiques basées sur les résultats
      if [ "$CLEANLINESS_SCORE" -lt 80 ]; then
          echo "                          <li>Le score de propreté est bas (${CLEANLINESS_SCORE}%). Considérez nettoyer le code avant de merger cette branche.</li>" >> "$AUDIT_REPORT_DIR/audit-report.html"
      fi
      
      if [ "$ORPHAN_TABLES_PERCENT" -gt 20 ]; then
          echo "                          <li>Trop de tables orphelines (${ORPHAN_TABLES_PERCENT}%). Créez des modèles Eloquent ou supprimez les tables inutiles.</li>" >> "$AUDIT_REPORT_DIR/audit-report.html"
      fi
      
      if [ "$UNUSED_MODELS" -gt 10 ]; then
          echo "                          <li>Trop de modèles non utilisés (${UNUSED_MODELS}). Vérifiez leur utilité ou supprimez-les.</li>" >> "$AUDIT_REPORT_DIR/audit-report.html"
      fi
      
      # Fermer le HTML
      cat >> "$AUDIT_REPORT_DIR/audit-report.html" << 'EOF'
                  </ul>
              </div>
              
              <div class="footer">
                  <p><strong>Pipeline GitLab CI/CD</strong> - Audit automatique de la qualité de la base de données</p>
                  <p>Ce rapport a été généré automatiquement lors de l'exécution du pipeline</p>
                  <p><a href="$CI_PIPELINE_URL" target="_blank">Voir le pipeline complet</a></p>
              </div>
          </div>
      </body>
      </html>
      EOF
      
      echo "📄 Rapport HTML généré avec succès dans $AUDIT_REPORT_DIR/audit-report.html"
  artifacts:
    paths:
      - audit-reports/
    reports:
      junit: report-results.xml
    expire_in: 1 month
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Job de vérification de qualité avec seuils configurables
quality-gate:
  stage: quality-gate
  image: alpine:latest
  dependencies:
    - run-database-audit
  script:
    - echo "🔍 Vérification de la qualité GitLab CI/CD..."
    - |
      # Charger les variables d'environnement
      source build.env
      
      echo "📊 Analyse des métriques:"
      echo "  - Score de propreté: ${CLEANLINESS_SCORE}% (seuil: ${CLEANLINESS_THRESHOLD}%)"
      echo "  - Tables orphelines: ${ORPHAN_TABLES_PERCENT}% (seuil: ${ORPHAN_TABLES_THRESHOLD}%)"
      echo "  - Modèles non utilisés: ${UNUSED_MODELS} (seuil: ${UNUSED_MODELS_THRESHOLD})"
      
      # Vérifier le score de propreté
      if [ "$CLEANLINESS_SCORE" -lt "$CLEANLINESS_THRESHOLD" ]; then
          echo "❌ Score de propreté critique: ${CLEANLINESS_SCORE}% < ${CLEANLINESS_THRESHOLD}%"
          echo "Le pipeline échouera pour maintenir la qualité du code"
          exit 1
      fi
      
      # Vérifier le pourcentage de tables orphelines
      if [ "$ORPHAN_TABLES_PERCENT" -gt "$ORPHAN_TABLES_THRESHOLD" ]; then
          echo "❌ Trop de tables orphelines: ${ORPHAN_TABLES_PERCENT}% > ${ORPHAN_TABLES_THRESHOLD}%"
          echo "Le pipeline échouera pour maintenir la qualité du code"
          exit 1
      fi
      
      # Vérifier les modèles non utilisés
      if [ "$UNUSED_MODELS" -gt "$UNUSED_MODELS_THRESHOLD" ]; then
          echo "❌ Trop de modèles non utilisés: ${UNUSED_MODELS} > ${UNUSED_MODELS_THRESHOLD}"
          echo "Le pipeline échouera pour maintenir la qualité du code"
          exit 1
      fi
      
      echo "✅ Tous les critères de qualité sont respectés"
      echo "🎉 Pipeline GitLab CI/CD réussi !"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Job de notification automatique
notify-team:
  stage: report
  image: curlimages/curl:latest
  dependencies:
    - run-database-audit
  script:
    - echo "🔔 Envoi des notifications GitLab CI/CD..."
    - |
      # Charger les variables d'environnement
      source build.env
      
      # Préparer le message de notification
      if [ "$CLEANLINESS_SCORE" -lt 80 ]; then
          EMOJI="⚠️"
          STATUS="Attention"
          COLOR="#ffc107"
      elif [ "$CLEANLINESS_SCORE" -lt 90 ]; then
          EMOJI="📊"
          STATUS="Bon"
          COLOR="#17a2b8"
      else
          EMOJI="🎉"
          STATUS="Excellent"
          COLOR="#28a745"
      fi
      
      # Message pour Slack
      if [ -n "$SLACK_WEBHOOK_URL" ]; then
          echo "📤 Envoi de la notification Slack..."
          curl -X POST -H 'Content-type: application/json' \
               --data "{\"text\":\"$EMOJI *Audit Base de Données GitLab CI/CD* - $STATUS\nScore: ${CLEANLINESS_SCORE}%\nTables orphelines: ${ORPHAN_TABLES}\nModèles non utilisés: ${UNUSED_MODELS}\nPipeline: $CI_PIPELINE_URL\"}" \
               "$SLACK_WEBHOOK_URL"
      fi
      
      # Message pour Teams
      if [ -n "$TEAMS_WEBHOOK_URL" ]; then
          echo "📤 Envoi de la notification Teams..."
          curl -X POST -H 'Content-type: application/json' \
               --data "{\"text\":\"$EMOJI **Audit Base de Données GitLab CI/CD** - $STATUS\nScore: ${CLEANLINESS_SCORE}%\nTables orphelines: ${ORPHAN_TABLES}\nModèles non utilisés: ${UNUSED_MODELS}\nPipeline: $CI_PIPELINE_URL\"}" \
               "$TEAMS_WEBHOOK_URL"
      fi
      
      # Webhook personnalisé
      if [ -n "$WEBHOOK_URL" ]; then
          echo "📤 Envoi du webhook personnalisé..."
          curl -X POST -H 'Content-type: application/json' \
               --data "{\"cleanliness_score\":\"${CLEANLINESS_SCORE}%\",\"total_tables\":${TOTAL_TABLES},\"orphan_tables\":${ORPHAN_TABLES},\"unused_models\":${UNUSED_MODELS},\"pipeline_url\":\"$CI_PIPELINE_URL\",\"timestamp\":\"$(date)\"}" \
               "$WEBHOOK_URL"
      fi
      
      echo "✅ Notifications envoyées avec succès"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual

# Job de déploiement conditionnel
deploy-if-quality-passed:
  stage: deploy
  image: alpine:latest
  dependencies:
    - quality-gate
  script:
    - echo "🚀 Déploiement autorisé - Qualité validée"
    - echo "📊 Score final: ${CLEANLINESS_SCORE}%"
    - echo "✅ Pipeline GitLab CI/CD réussi"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  environment:
    name: production
    url: https://your-production-url.com
