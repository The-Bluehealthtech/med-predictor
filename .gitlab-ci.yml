# Pipeline GitLab CI/CD avec Notifications Email
# Version: 2.0 - Notifications Intégrées

stages:
  - validate
  - test
  - build
  - deploy
  - notify

# Variables globales
variables:
  # Configuration des notifications
  NOTIFICATION_EMAIL: "im0668@gmail.com"
  NOTIFICATION_SCRIPT: "scripts/gitlab-notifications.sh"
  
  # Configuration GitLab
  GITLAB_PROJECT_URL: "https://gitlab.com/izhar7-group/izhar7-project"
  
  # Configuration PHP
  PHP_VERSION: "8.2"
  COMPOSER_CACHE_DIR: ".composer-cache"
  
  # Configuration des tests
  PHPUNIT_COVERAGE_MIN: "80"
  PHPUNIT_COVERAGE_HTML: "coverage/"

# Cache Composer
cache:
  paths:
    - vendor/
    - $COMPOSER_CACHE_DIR

# Validation YAML et syntaxe
validate:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache yamllint
  script:
    - echo "🔍 Validation des fichiers YAML..."
    - echo "🔍 Variables d'environnement disponibles:"
    - echo "CI_COMMIT_BRANCH: $CI_COMMIT_BRANCH"
    - echo "CI_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE"
    - echo "CI_PROJECT_NAME: $CI_PROJECT_NAME"
    - yamllint .gitlab-ci.yml
    - echo "✅ Validation YAML terminée"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop-v3"
    - if: $CI_COMMIT_BRANCH == "main"

# Tests PHP simplifiés pour diagnostic
test:
  stage: test
  image: php:${PHP_VERSION}-fpm
  before_script:
    - echo "🔍 Diagnostic des variables d'environnement..."
    - echo "CI_COMMIT_BRANCH: $CI_COMMIT_BRANCH"
    - echo "CI_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE"
    - echo "CI_PROJECT_NAME: $CI_PROJECT_NAME"
    - echo "PHP_VERSION: $PHP_VERSION"
    - php --version
    - echo "✅ Diagnostic terminé"
  script:
    - echo "🧪 Test simple PHP..."
    - echo "Hello from GitLab CI!"
    - echo "✅ Test simple terminé"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop-v3"
    - if: $CI_COMMIT_BRANCH == "main"

# Audit du projet
audit:
  stage: test
  image: php:${PHP_VERSION}-fpm
  before_script:
    - apt-get update && apt-get install -y git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist
  script:
    - echo "🔍 Audit du projet..."
    - php artisan project:audit --format=json --output=audit-report.json
    - php artisan project:db:audit --output=db-audit-report.json
    - echo "✅ Audit terminé"
  artifacts:
    paths:
      - audit-report.json
      - db-audit-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-v3"
    - if: $CI_COMMIT_BRANCH == "main"

# Build de l'application simplifié
build:
  stage: build
  image: php:${PHP_VERSION}-fpm
  before_script:
    - echo "🔍 Diagnostic du build..."
    - echo "PHP_VERSION: $PHP_VERSION"
    - php --version
    - echo "✅ Diagnostic terminé"
  script:
    - echo "🏗️ Build simple..."
    - echo "Build successful!"
    - echo "✅ Build terminé"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-v3"
    - if: $CI_COMMIT_BRANCH == "main"

# Déploiement en staging
deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "🚀 Déploiement en staging..."
    - ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && git pull origin develop-v3"
    - ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && composer install --no-dev --optimize-autoloader"
    - ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && php artisan migrate --force"
    - ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && php artisan config:cache"
    - echo "✅ Déploiement staging terminé"
  environment:
    name: staging
    url: $STAGING_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-v3"
  when: manual

# Déploiement en production
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "🚀 Déploiement en production..."
    - ssh -o StrictHostKeyChecking=no $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && git pull origin main"
    - ssh -o StrictHostKeyChecking=no $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && composer install --no-dev --optimize-autoloader"
    - ssh -o StrictHostKeyChecking=no $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && php artisan migrate --force"
    - ssh -o StrictHostKeyChecking=no $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && php artisan config:cache"
    - echo "✅ Déploiement production terminé"
  environment:
    name: production
    url: $PRODUCTION_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual

# Notifications de succès simplifiées
notify_success:
  stage: notify
  image: alpine:latest
  script:
    - echo "📧 Notification de succès..."
    - echo "Pipeline: $CI_PIPELINE_ID"
    - echo "Branch: $CI_COMMIT_BRANCH"
    - echo "✅ Notification envoyée"
  rules:
    - if: $CI_PIPELINE_STATUS == "success"
  dependencies:
    - test
    - build

# Notifications d'échec simplifiées
notify_failure:
  stage: notify
  image: alpine:latest
  script:
    - echo "📧 Notification d'échec..."
    - echo "Pipeline: $CI_PIPELINE_ID"
    - echo "Branch: $CI_COMMIT_BRANCH"
    - echo "✅ Notification envoyée"
  rules:
    - if: $CI_PIPELINE_STATUS == "failed"
  when: on_failure

# Notifications d'annulation simplifiées
notify_canceled:
  stage: notify
  image: alpine:latest
  script:
    - echo "📧 Notification d'annulation..."
    - echo "Pipeline: $CI_PIPELINE_ID"
    - echo "Branch: $CI_COMMIT_BRANCH"
    - echo "✅ Notification envoyée"
  rules:
    - if: $CI_PIPELINE_STATUS == "canceled"
  when: on_failure

# Job de nettoyage
cleanup:
  stage: .post
  image: alpine:latest
  script:
    - echo "🧹 Nettoyage des artefacts..."
    - echo "✅ Nettoyage terminé"
  when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop-v3"
    - if: $CI_COMMIT_BRANCH == "main"
