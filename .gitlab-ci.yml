# Pipeline GitLab CI/CD avec Notifications Email
# Version: 2.0 - Notifications Intégrées

stages:
  - validate
  - test
  - build
  - deploy
  - notify

# Variables globales
variables:
  # Configuration des notifications
  NOTIFICATION_EMAIL: "im0668@gmail.com"
  NOTIFICATION_SCRIPT: "scripts/gitlab-notifications.sh"
  
  # Configuration GitLab
  GITLAB_PROJECT_URL: "https://gitlab.com/izhar7-group/izhar7-project"
  
  # Configuration PHP
  PHP_VERSION: "8.2"
  COMPOSER_CACHE_DIR: ".composer-cache"
  
  # Configuration des tests
  PHPUNIT_COVERAGE_MIN: "80"
  PHPUNIT_COVERAGE_HTML: "coverage/"

# Cache Composer
cache:
  paths:
    - vendor/
    - $COMPOSER_CACHE_DIR

# Validation YAML et syntaxe
validate:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache yamllint
  script:
    - echo "🔍 Validation des fichiers YAML..."
    - yamllint .gitlab-ci.yml
    - yamllint notifications.yml
    - echo "✅ Validation YAML terminée"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop-v3"
    - if: $CI_COMMIT_BRANCH == "main"

# Tests PHP
test:
  stage: test
  image: php:${PHP_VERSION}-fpm
  services:
    - mysql:8.0
  variables:
    MYSQL_DATABASE: "med_predictor_test"
    MYSQL_ROOT_PASSWORD: "test_password"
    MYSQL_USER: "test_user"
    MYSQL_PASSWORD: "test_password"
  before_script:
    - apt-get update && apt-get install -y git unzip libzip-dev libicu-dev
    - docker-php-ext-install zip intl pdo_mysql
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist --optimize-autoloader
    - cp .env.example .env
    - php artisan key:generate
    - php artisan config:cache
  script:
    - echo "🧪 Exécution des tests PHP..."
    - php artisan test --coverage-html=$PHPUNIT_COVERAGE_HTML
    - echo "✅ Tests terminés"
  coverage: '/^\s*Lines:\s*(\d+\.?\d*)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop-v3"
    - if: $CI_COMMIT_BRANCH == "main"

# Audit du projet
audit:
  stage: test
  image: php:${PHP_VERSION}-fpm
  before_script:
    - apt-get update && apt-get install -y git unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist
  script:
    - echo "🔍 Audit du projet..."
    - php artisan project:audit --format=json --output=audit-report.json
    - php artisan project:db:audit --output=db-audit-report.json
    - echo "✅ Audit terminé"
  artifacts:
    paths:
      - audit-report.json
      - db-audit-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-v3"
    - if: $CI_COMMIT_BRANCH == "main"

# Build de l'application
build:
  stage: build
  image: php:${PHP_VERSION}-fpm
  before_script:
    - apt-get update && apt-get install -y git unzip libzip-dev
    - docker-php-ext-install zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-dev --optimize-autoloader
  script:
    - echo "🏗️ Build de l'application..."
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
    - echo "✅ Build terminé"
  artifacts:
    paths:
      - vendor/
      - bootstrap/cache/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-v3"
    - if: $CI_COMMIT_BRANCH == "main"

# Déploiement en staging
deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "🚀 Déploiement en staging..."
    - ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && git pull origin develop-v3"
    - ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && composer install --no-dev --optimize-autoloader"
    - ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && php artisan migrate --force"
    - ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_HOST "cd $STAGING_PATH && php artisan config:cache"
    - echo "✅ Déploiement staging terminé"
  environment:
    name: staging
    url: $STAGING_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "develop-v3"
  when: manual

# Déploiement en production
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - echo "🚀 Déploiement en production..."
    - ssh -o StrictHostKeyChecking=no $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && git pull origin main"
    - ssh -o StrictHostKeyChecking=no $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && composer install --no-dev --optimize-autoloader"
    - ssh -o StrictHostKeyChecking=no $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && php artisan migrate --force"
    - ssh -o StrictHostKeyChecking=no $PRODUCTION_USER@$PRODUCTION_HOST "cd $PRODUCTION_PATH && php artisan config:cache"
    - echo "✅ Déploiement production terminé"
  environment:
    name: production
    url: $PRODUCTION_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual

# Notifications de succès
notify_success:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl
  script:
    - echo "📧 Envoi de notification de succès..."
    - export CI_PIPELINE_STATUS="success"
    - bash $NOTIFICATION_SCRIPT
    - echo "✅ Notification de succès envoyée"
  rules:
    - if: $CI_PIPELINE_STATUS == "success"
  dependencies:
    - test
    - build

# Notifications d'échec
notify_failure:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl
  script:
    - echo "📧 Envoi de notification d'échec..."
    - export CI_PIPELINE_STATUS="failed"
    - bash $NOTIFICATION_SCRIPT
    - echo "✅ Notification d'échec envoyée"
  rules:
    - if: $CI_PIPELINE_STATUS == "failed"
  when: on_failure

# Notifications d'annulation
notify_canceled:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl
  script:
    - echo "📧 Envoi de notification d'annulation..."
    - export CI_PIPELINE_STATUS="canceled"
    - bash $NOTIFICATION_SCRIPT
    - echo "✅ Notification d'annulation envoyée"
  rules:
    - if: $CI_PIPELINE_STATUS == "canceled"
  when: on_failure

# Job de nettoyage
cleanup:
  stage: .post
  image: alpine:latest
  script:
    - echo "🧹 Nettoyage des artefacts..."
    - echo "✅ Nettoyage terminé"
  when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop-v3"
    - if: $CI_COMMIT_BRANCH == "main"
