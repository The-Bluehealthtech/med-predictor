<!DOCTYPE html>
<html>
<head>
    <title>FIT Platform v3.0</title>
    <meta charset="utf-8">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 50px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 { 
            font-size: 3.5em; 
            margin-bottom: 20px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .status { 
            background: rgba(255,255,255,0.1); 
            padding: 25px; 
            border-radius: 15px; 
            max-width: 600px; 
            margin: 20px auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        p { 
            font-size: 1.2em; 
            margin: 10px 0; 
            opacity: 0.9;
        }
        .deploy-info {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>🚀 FIT Platform v3.0</h1>
    <div class="status">
        <p><strong>✅ Successfully deployed on Google Cloud!</strong></p>
        <p>Date: <span id="date"></span></p>
        <p>Ready for configuration with <strong>fit.tbhc.uk</strong></p>
    </div>
    <div class="deploy-info">
        Deployed from manual deployment<br>
        Version: 3.0.0 | Environment: Production
    </div>
    <script>
        document.getElementById("date").textContent = new Date().toLocaleString();
    </script>
</body>
</html>
