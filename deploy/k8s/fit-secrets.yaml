apiVersion: v1
kind: Secret
metadata:
  name: fit-app-secrets
  namespace: fit-production
type: Opaque
data:
  # Générer avec: echo -n "votre-valeur" | base64
  APP_KEY: <base64-encoded-app-key>
  DB_PASSWORD: <base64-encoded-db-password>
  JWT_SECRET: <base64-encoded-jwt-secret>
---
apiVersion: v1
kind: Secret
metadata:
  name: fit-mysql-secret
  namespace: fit-production
type: Opaque
data:
  root-password: <base64-encoded-root-password>

















