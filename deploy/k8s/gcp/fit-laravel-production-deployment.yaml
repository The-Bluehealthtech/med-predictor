apiVersion: apps/v1
kind: Deployment
metadata:
  name: fit-laravel-app
  namespace: fit-production
  labels:
    app: fit-laravel-app
    environment: production
    platform: gcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fit-laravel-app
  template:
    metadata:
      labels:
        app: fit-laravel-app
        environment: production
        platform: gcp
    spec:
      containers:
      - name: fit-app
        image: izharmahjoub/laravel-fit-app:v1.4
        ports:
        - containerPort: 80
        env:
        - name: APP_ENV
          valueFrom:
            secretKeyRef:
              name: fit-app-env
              key: APP_ENV
        - name: APP_DEBUG
          valueFrom:
            secretKeyRef:
              name: fit-app-env
              key: APP_DEBUG
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: fit-app-env
              key: APP_KEY
        - name: APP_URL
          valueFrom:
            secretKeyRef:
              name: fit-app-env
              key: APP_URL
        - name: DB_CONNECTION
          value: "mysql"
        - name: DB_HOST
          value: "fit-mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_DATABASE
          value: "fit_production"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          value: "rootpassword123"
        - name: REDIS_HOST
          value: "fit-redis"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fit-app-env
              key: REDIS_PASSWORD
        - name: CACHE_DRIVER
          value: "file"
        - name: SESSION_DRIVER
          value: "file"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fit-laravel-service
  namespace: fit-production
  labels:
    app: fit-laravel-app
    environment: production
    platform: gcp
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: fit-laravel-app
