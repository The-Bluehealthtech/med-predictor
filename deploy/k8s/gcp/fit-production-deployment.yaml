apiVersion: apps/v1
kind: Deployment
metadata:
  name: fit-app
  namespace: fit-production
  labels:
    app: fit-app
    version: v1.0.0
    environment: production
    platform: gcp
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fit-app
  template:
    metadata:
      labels:
        app: fit-app
        version: v1.0.0
        environment: production
        platform: gcp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      imagePullSecrets:
      - name: gcr-secret
      containers:
      - name: fit-app
        image: gcr.io/YOUR_PROJECT_ID/fit-app:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
          name: http
          protocol: TCP
        env:
        - name: APP_ENV
          value: "production"
        - name: APP_DEBUG
          value: "false"
        - name: APP_URL
          value: "https://fit3.tbhc.uk"
        - name: LOG_LEVEL
          value: "info"
        - name: CACHE_DRIVER
          value: "redis"
        - name: SESSION_DRIVER
          value: "redis"
        - name: QUEUE_CONNECTION
          value: "redis"
        - name: DB_HOST
          value: "fit-mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_DATABASE
          value: "fit_production"
        - name: REDIS_HOST
          value: "fit-redis"
        - name: REDIS_PORT
          value: "6379"
        envFrom:
        - secretRef:
            name: fit-app-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9000
            httpHeaders:
            - name: User-Agent
              value: kube-probe/1.0
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 9000
            httpHeaders:
            - name: User-Agent
              value: kube-probe/1.0
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: storage
          mountPath: /var/www/html/storage
          subPath: app
        - name: cache
          mountPath: /var/www/html/bootstrap/cache
        - name: logs
          mountPath: /var/www/html/storage/logs
        - name: config
          mountPath: /var/www/html/config
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: fit-storage-pvc
      - name: cache
        emptyDir:
          medium: Memory
          sizeLimit: "256Mi"
      - name: logs
        emptyDir:
          medium: Memory
          sizeLimit: "100Mi"
      - name: config
        configMap:
          name: fit-app-config
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      nodeSelector:
        cloud.google.com/gke-nodepool: "default-pool"
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
---
apiVersion: v1
kind: Service
metadata:
  name: fit-service
  namespace: fit-production
  labels:
    app: fit-app
    environment: production
    platform: gcp
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 9000
    protocol: TCP
    name: http
  selector:
    app: fit-app
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fit-ingress
  namespace: fit-production
  labels:
    app: fit-app
    environment: production
    platform: gcp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "nginx"
    external-dns.alpha.kubernetes.io/hostname: "fit3.tbhc.uk"
spec:
  tls:
  - hosts:
    - fit3.tbhc.uk
    secretName: fit-tls
  rules:
  - host: fit3.tbhc.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fit-service
            port:
              number: 80
















