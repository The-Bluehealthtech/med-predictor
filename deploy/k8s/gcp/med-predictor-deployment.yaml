apiVersion: apps/v1
kind: Deployment
metadata:
  name: med-predictor-deployment
  namespace: med-predictor
  labels:
    app: med-predictor
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: med-predictor
  template:
    metadata:
      labels:
        app: med-predictor
    spec:
      containers:
      - name: med-predictor
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: med-predictor-service
  namespace: med-predictor
  labels:
    app: med-predictor
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: med-predictor

