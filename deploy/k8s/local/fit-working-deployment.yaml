apiVersion: apps/v1
kind: Deployment
metadata:
  name: fit-working-app
  namespace: med-predictor
  labels:
    app: fit-working
    component: laravel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fit-working
      component: laravel-app
  template:
    metadata:
      labels:
        app: fit-working
        component: laravel-app
    spec:
      containers:
      - name: fit-app
        image: fit-local:test
        ports:
        - containerPort: 9000
        env:
        - name: APP_ENV
          value: "local"
        - name: APP_DEBUG
          value: "true"
        - name: DB_HOST
          value: "med-predictor-mysql"
        - name: REDIS_HOST
          value: "med-predictor-redis"
        - name: REDIS_PASSWORD
          value: ""
        - name: QUEUE_CONNECTION
          value: "sync"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: laravel-config
          mountPath: /var/www/html/.env
          subPath: .env
      volumes:
      - name: laravel-config
        configMap:
          name: laravel-config
---
apiVersion: v1
kind: Service
metadata:
  name: fit-working-service
  namespace: med-predictor
  labels:
    app: fit-working
    component: service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 9000
    protocol: TCP
    name: http
  selector:
    app: fit-working
    component: laravel-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fit-working-ingress
  namespace: med-predictor
  labels:
    app: fit-working
    component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: fit.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fit-working-service
            port:
              number: 80
