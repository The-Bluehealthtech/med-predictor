version: '3.8'

services:
  # Base de données MySQL
  fit-mysql:
    image: mysql:8.0
    container_name: fit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fit_root_password
      MYSQL_DATABASE: fit_database
      MYSQL_USER: fit_user
      MYSQL_PASSWORD: fit_password
    ports:
      - "3306:3306"
    volumes:
      - fit_mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - fit-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis pour les queues et cache
  fit-redis:
    image: redis:7-alpine
    container_name: fit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - fit_redis_data:/data
    networks:
      - fit-network

  # Application PHP-FPM
  fit-php:
    image: fit-local:test
    container_name: fit-php
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/php.ini
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=fit-mysql
      - DB_PORT=3306
      - DB_DATABASE=fit_database
      - DB_USERNAME=fit_user
      - DB_PASSWORD=fit_password
      - REDIS_HOST=fit-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=null
    networks:
      - fit-network
    depends_on:
      - fit-mysql
      - fit-redis

  # Serveur Web Nginx
  fit-nginx:
    image: nginx:alpine
    container_name: fit-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx-fit.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fit-network
    depends_on:
      - fit-php

volumes:
  fit_mysql_data:
  fit_redis_data:


networks:
  fit-network:
    driver: bridge







