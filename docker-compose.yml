version: '3.8'

services:
  # Laravel Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: med-predictor-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/php.ini
    environment:
      - CONTAINER_NAME=med-predictor-app
      - TOTAL_CONTAINERS=6
      - CONTAINERS_RUNNING=6
      - DOCKER_IMAGES=6
      - DOCKER_NETWORKS=1
      - DOCKER_VOLUMES=2
      - GIT_BRANCH=stable-sept5-with-fixes
      - GIT_LAST_COMMIT=2025-09-16 08:57:57 +0100
      - GIT_COMMIT_COUNT=0
      - GIT_STATUS=clean
    networks:
      - med-predictor-network
    depends_on:
      - mysql
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: med-predictor-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx-app.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
      - ./public:/var/www/html/public
    networks:
      - med-predictor-network
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: med-predictor-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: med_predictor
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: med_user
      MYSQL_PASSWORD: med_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - med-predictor-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: med-predictor-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - med-predictor-network

  # MailHog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: med-predictor-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - med-predictor-network

  # Adminer for Database Management
  adminer:
    image: adminer:latest
    container_name: med-predictor-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks:
      - med-predictor-network
    depends_on:
      - mysql

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  med-predictor-network:
    driver: bridge
