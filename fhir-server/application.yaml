# Configuration du serveur FHIR de FIT (HAPI FHIR JPA Server v8.12.0-2), fusionnée avec
# la configuration par défaut de l'image (/app/config/application.yaml).
#
# Normes : HL7 FHIR R4 (4.0.1) ; guides publiés chargés à l'installation, versions figées et
# cohérentes avec IHE sIPS 1.0.0 (qui exige IPS 1.1.x et MHD 4.2.x) :
#   hl7.fhir.uv.ips 1.1.0 · ihe.iti.sips 1.0.0 · ihe.iti.mhd 4.2.4 · ihe.iti.pdqm 3.2.0
#   ihe.iti.pixm 3.1.0 · ihe.iti.balp 1.1.4
# QEDm (ihe.pcc.qedm 3.0.0) ne définit aucun profil clinique, seulement des interactions de
# recherche ; il n'est pas chargé (ses dépendances PDQm 3.1.x / PIXm 3.0.x entreraient en
# conflit) : la conformité QEDm est vérifiée par FIT (php artisan fhir:conformance).
# La même liste figure dans config/fhir.php (côté FIT) : les deux doivent rester identiques.

spring:
  datasource:
    url: jdbc:postgresql://${HAPI_DB_HOST}:${HAPI_DB_PORT:5432}/${HAPI_DB_DATABASE}
    username: ${HAPI_DB_USERNAME}
    password: ${HAPI_DB_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hibernate.search.enabled: false

hapi:
  fhir:
    fhir_version: R4
    # Adresse interne du service (réseau privé Render) : HAPI_HOSTPORT = « hôte:port » fourni par le blueprint.
    server_address: http://${HAPI_HOSTPORT:localhost:8080}/fhir/
    openapi_enabled: false
    narrative_enabled: false
    mdm_enabled: false
    ig_runtime_upload_enabled: false
    install_transitive_ig_dependencies: true

    # Les ressources reçues sont validées contre FHIR R4 et les profils qu'elles déclarent.
    validation:
      requests_enabled: true
      responses_enabled: false

    # Patient/$summary (IPS) : génération de l'IPS à partir des données du serveur.
    ips_enabled: true

    # Abonnements FHIR R4 (rest-hook) : le serveur prévient FIT quand un compte rendu arrive
    # (Subscription créée par php artisan fhir:subscriptions:install).
    subscription:
      resthook_enabled: true
      websocket_enabled: false

    implementationguides:
      ips:
        name: hl7.fhir.uv.ips
        version: 1.1.0
        installMode: STORE_AND_INSTALL
      mhd:
        name: ihe.iti.mhd
        version: 4.2.4
        installMode: STORE_AND_INSTALL
      sips:
        name: ihe.iti.sips
        version: 1.0.0
        installMode: STORE_AND_INSTALL
      pdqm:
        name: ihe.iti.pdqm
        version: 3.2.0
        installMode: STORE_AND_INSTALL
      pixm:
        name: ihe.iti.pixm
        version: 3.1.0
        installMode: STORE_AND_INSTALL
      balp:
        name: ihe.iti.balp
        version: 1.1.4
        installMode: STORE_AND_INSTALL
