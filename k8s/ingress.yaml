apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fit-platform-ingress
  labels:
    app: fit-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - fit-platform.local
    - www.fit-platform.local
    secretName: fit-platform-tls
  rules:
  - host: fit-platform.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fit-platform-nginx-service
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: fit-platform-app-service
            port:
              number: 9000
      - path: /ready
        pathType: Exact
        backend:
          service:
            name: fit-platform-app-service
            port:
              number: 9000
  - host: www.fit-platform.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fit-platform-nginx-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fit-platform-app-hpa
  labels:
    app: fit-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fit-platform-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fit-platform-nginx-hpa
  labels:
    app: fit-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fit-platform-nginx
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

