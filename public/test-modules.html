<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test des Modules - Rapport</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-ok { background-color: #10B981; }
        .status-error { background-color: #EF4444; }
        .status-view-not-found { background-color: #F59E0B; }
    </style>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- Header -->
            <div class="bg-white shadow-sm rounded-lg mb-6">
                <div class="px-6 py-4">
                    <h1 class="text-3xl font-bold text-gray-900">Test des Modules - Rapport</h1>
                    <p class="text-gray-600 mt-2">État de toutes les cartes des modules</p>
                    <p class="text-sm text-gray-500 mt-1">Généré le <span id="currentDate"></span></p>
                </div>
            </div>

            <!-- Statistiques -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white overflow-hidden shadow-sm sm:rounded-lg">
                    <div class="p-6">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center">
                                    <svg class="w-5 h-5 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                                    </svg>
                                </div>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 truncate">OK</dt>
                                    <dd class="text-lg font-medium text-gray-900" id="okCount">0</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white overflow-hidden shadow-sm sm:rounded-lg">
                    <div class="p-6">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center">
                                    <svg class="w-5 h-5 text-red-600" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                                    </svg>
                                </div>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 truncate">Erreurs</dt>
                                    <dd class="text-lg font-medium text-gray-900" id="errorCount">0</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white overflow-hidden shadow-sm sm:rounded-lg">
                    <div class="p-6">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <div class="w-8 h-8 bg-yellow-100 rounded-full flex items-center justify-center">
                                    <svg class="w-5 h-5 text-yellow-600" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                                    </svg>
                                </div>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 truncate">Vue non trouvée</dt>
                                    <dd class="text-lg font-medium text-gray-900" id="notFoundCount">0</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white overflow-hidden shadow-sm sm:rounded-lg">
                    <div class="p-6">
                        <div class="flex items-center">
                            <div class="flex-shrink-0">
                                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                                    <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path>
                                    </svg>
                                </div>
                            </div>
                            <div class="ml-5 w-0 flex-1">
                                <dl>
                                    <dt class="text-sm font-medium text-gray-500 truncate">Total</dt>
                                    <dd class="text-lg font-medium text-gray-900" id="totalCount">0</dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tableau des résultats -->
            <div class="bg-white shadow-sm rounded-lg overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-900">Détail des Modules</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Module</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Vue</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Chemin</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Statut</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Code HTTP</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">URL</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Test</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="resultsTable">
                            <!-- Les résultats seront ajoutés par JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Résumé par module -->
            <div class="mt-8 bg-white shadow-sm rounded-lg overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-900">Résumé par Module</h2>
                </div>
                <div class="p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="moduleSummary">
                        <!-- Le résumé sera ajouté par JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Données des modules
        const modules = [
            { module: 'appointments', views: ['index'], routes: ['appointments.index'] },
            { module: 'association', views: ['index', 'registration'], routes: ['association.index', 'association.registration'] },
            { module: 'association/fraud-detection', views: ['index', 'alerts', 'analysis', 'reports', 'settings'], routes: ['fraud-detection.index', 'fraud-detection.alerts', 'fraud-detection.analysis', 'fraud-detection.reports', 'fraud-detection.settings'] },
            { module: 'associations', views: ['index', 'edit', 'show-simple', 'show'], routes: ['associations.index', 'associations.edit', 'associations.show-simple', 'associations.show'] },
            { module: 'clinical', views: ['support-dashboard'], routes: ['clinical.support-dashboard'] },
            { module: 'club', views: ['player-licenses/index'], routes: ['club.player-licenses.index'] },
            { module: 'clubs', views: ['index', 'edit', 'show', 'test'], routes: ['clubs.index', 'clubs.edit', 'clubs.show', 'clubs.test'] },
            { module: 'competitions', views: ['index', 'test'], routes: ['competitions.index', 'competitions.test'] },
            { module: 'confederations', views: ['index', 'edit', 'show'], routes: ['confederations.index', 'confederations.edit', 'confederations.show'] },
            { module: 'dataset', views: ['analytics'], routes: ['dataset.analytics'] },
            { module: 'device-connections', views: ['index'], routes: ['device-connections.index'] },
            { module: 'dtn', views: ['dashboard', 'expats', 'index', 'medical', 'planning', 'reports', 'selections', 'settings', 'teams'], routes: ['dtn.dashboard', 'dtn.expats', 'dtn.index', 'dtn.medical', 'dtn.planning', 'dtn.reports', 'dtn.selections', 'dtn.settings', 'dtn.teams'] },
            { module: 'fifa', views: ['dashboard'], routes: ['fifa.dashboard'] },
            { module: 'fixtures', views: ['index'], routes: ['fixtures.index'] },
            { module: 'healthcare', views: ['dashboard', 'index', 'predictions'], routes: ['healthcare.dashboard', 'healthcare.index', 'healthcare.predictions'] },
            { module: 'healthcare/records', views: ['edit', 'show'], routes: ['healthcare.records.edit', 'healthcare.records.show'] },
            { module: 'licenses', views: ['index', 'validation'], routes: ['licenses.index', 'licenses.validation'] },
            { module: 'medical', views: ['athlete-edit', 'athlete-profile', 'athlete', 'index'], routes: ['medical.athlete-edit', 'medical.athlete-profile', 'medical.athlete', 'medical.index'] },
            { module: 'pcma', views: ['fraud-detection'], routes: ['pcma.fraud-detection'] },
            { module: 'performances', views: ['index'], routes: ['performances.index'] },
            { module: 'player-passports', views: ['index'], routes: ['player-passports.index'] },
            { module: 'player-registration', views: ['bulk-import', 'create-stakeholder', 'create', 'dashboard', 'edit', 'health-records', 'index', 'show'], routes: ['player-registration.bulk-import', 'player-registration.create-stakeholder', 'player-registration.create', 'player-registration.dashboard', 'player-registration.edit', 'player-registration.health-records', 'player-registration.index', 'player-registration.show'] },
            { module: 'players', views: ['index', 'registration'], routes: ['players.index', 'players.registration'] },
            { module: 'portal', views: ['dashboard'], routes: ['portal.dashboard'] },
            { module: 'profile', views: ['show'], routes: ['profile.show'] },
            { module: 'rankings', views: ['index'], routes: ['rankings.index'] },
            { module: 'referee', views: ['dashboard'], routes: ['referee.dashboard'] },
            { module: 'referees', views: ['index'], routes: ['referees.index'] },
            { module: 'role-management', views: ['create', 'edit', 'index', 'show'], routes: ['role-management.create', 'role-management.edit', 'role-management.index', 'role-management.show'] },
            { module: 'rpm', views: ['attendance', 'calendar', 'dashboard', 'load', 'matches', 'reports', 'sessions', 'settings', 'sync'], routes: ['rpm.attendance', 'rpm.calendar', 'rpm.dashboard', 'rpm.load', 'rpm.matches', 'rpm.reports', 'rpm.sessions', 'rpm.settings', 'rpm.sync'] },
            { module: 'secretary', views: ['dashboard'], routes: ['secretary.dashboard'] },
            { module: 'teams', views: ['create', 'edit', 'index', 'show'], routes: ['teams.create', 'teams.edit', 'teams.index', 'teams.show'] },
            { module: 'user-management', views: ['create', 'dashboard', 'edit', 'index', 'show'], routes: ['user-management.create', 'user-management.dashboard', 'user-management.edit', 'user-management.index', 'user-management.show'] }
        ];

        // Fonction pour tester une URL
        async function testUrl(url) {
            try {
                const response = await fetch(url, { 
                    method: 'GET',
                    mode: 'cors'
                });
                if (response.ok) {
                    return 'OK';
                } else {
                    return `ERROR ${response.status}`;
                }
            } catch (error) {
                return 'ERROR';
            }
        }

        // Fonction pour tester une vue
        async function testView(module, view) {
            const viewPath = `modules.${module}.${view}`;
            const url =
             http://localhost:8080/modules/${module}/${view}`;
            
            try {
                const response = await fetch(url, { 
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    return { status: 'OK', error: null, url: url, statusCode: response.status };
                } else {
                    return { status: 'ERROR', error: `HTTP ${response.status}`, url: url, statusCode: response.status };
                }
            } catch (error) {
                return { status: 'ERROR', error: error.message, url: url, statusCode: 'Network Error' };
            }
        }

        // Fonction pour générer le tableau des résultats
        async function generateResults() {
            const results = [];
            let okCount = 0;
            let errorCount = 0;
            let notFoundCount = 0;

            for (const moduleData of modules) {
                for (let i = 0; i < moduleData.views.length; i++) {
                    const view = moduleData.views[i];
                    const route = moduleData.routes[i] || 'No route mapped';
                    const result = await testView(moduleData.module, view);
                    
                    results.push({
                        module: moduleData.module,
                        view: view,
                        viewPath: `modules.${moduleData.module}.${view}`,
                        status: result.status,
                        error: result.error,
                        url: result.url,
                        route: route
                    });

                    if (result.status === 'OK') okCount++;
                    else if (result.status === 'ERROR') errorCount++;
                    else notFoundCount++;
                }
            }

            // Mettre à jour les compteurs
            document.getElementById('okCount').textContent = okCount;
            document.getElementById('errorCount').textContent = errorCount;
            document.getElementById('notFoundCount').textContent = notFoundCount;
            document.getElementById('totalCount').textContent = results.length;

            // Générer le tableau
            const tbody = document.getElementById('resultsTable');
            tbody.innerHTML = results.map(result => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                        ${result.module}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${result.view}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${result.viewPath}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        ${result.status === 'OK' ? 
                            '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">OK</span>' :
                            result.status === 'ERROR' ?
                            '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">ERREUR</span>' :
                            '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">VUE NON TROUVÉE</span>'
                        }
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span class="font-mono ${result.statusCode === 200 ? 'text-green-600' : result.statusCode >= 400 ? 'text-red-600' : 'text-gray-600'}">
                            ${result.statusCode || 'N/A'}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <a href="${result.url}" target="_blank" class="text-blue-600 hover:text-blue-900">
                            ${result.url.length > 50 ? result.url.substring(0, 50) + '...' : result.url}
                        </a>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <button onclick="testSingleUrl('${result.url}')" class="text-blue-600 hover:text-blue-900">
                            Tester
                        </button>
                    </td>
                </tr>
            `).join('');

            // Générer le résumé par module
            const moduleSummary = document.getElementById('moduleSummary');
            const moduleGroups = results.reduce((acc, result) => {
                if (!acc[result.module]) acc[result.module] = [];
                acc[result.module].push(result);
                return acc;
            }, {});

            moduleSummary.innerHTML = Object.entries(moduleGroups).map(([module, moduleResults]) => {
                const ok = moduleResults.filter(r => r.status === 'OK').length;
                const errors = moduleResults.filter(r => r.status === 'ERROR').length;
                const notFound = moduleResults.filter(r => r.status === 'VIEW_NOT_FOUND').length;
                const total = moduleResults.length;

                return `
                    <div class="border border-gray-200 rounded-lg p-4">
                        <h3 class="font-semibold text-gray-900 mb-2">${module}</h3>
                        <div class="space-y-1">
                            <div class="flex justify-between text-sm">
                                <span class="text-green-600">OK:</span>
                                <span class="font-medium">${ok}</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span class="text-red-600">Erreurs:</span>
                                <span class="font-medium">${errors}</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span class="text-yellow-600">Vues manquantes:</span>
                                <span class="font-medium">${notFound}</span>
                            </div>
                            <div class="flex justify-between text-sm font-medium">
                                <span>Total:</span>
                                <span>${total}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Fonction pour tester une URL individuelle
        async function testSingleUrl(url) {
            try {
                const response = await fetch(url);
                if (response.ok) {
                    alert('URL accessible !');
                } else {
                    alert('URL non accessible - Status: ' + response.status);
                }
            } catch (error) {
                alert('Erreur: ' + error.message);
            }
        }

        // Initialiser la page
        document.addEventListener('DOMContentLoaded', function() {
            // Afficher la date actuelle
            document.getElementById('currentDate').textContent = new Date().toLocaleString('fr-FR');
            
            // Générer les résultats
            generateResults();
        });
    </script>
</body>
</html>
